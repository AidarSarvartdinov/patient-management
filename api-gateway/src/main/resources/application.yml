server:
    port: 4004

jwkSetUri: http://auth-service:4005/.well-known/jwks.json

spring:
    cloud:
        gateway:
            routes:
                - id: billing-service-route
                  uri: http://billing-service:4001
                  predicates:
                    - Path=/api/payments/**
                  filters:
                    - StripPrefix=1
                
                - id: billing-webhook-route
                  uri: http://billing-service:4001
                  predicates:
                    - Path=/stripe/webhook

                - id: scheduling-service-route
                  uri: http://scheduling-service:4006
                  predicates:
                    - Path=/api/slots/**
                  filters:
                    - StripPrefix=1

                - id: auth-service-route
                  uri: http://auth-service:4005
                  predicates:
                    - Path=/auth/**
                  filters:
                    - StripPrefix=1 

                - id: patient-service-route
                  uri: http://patient-service:4000
                  predicates:
                    - Path=/api/patients/**
                  filters:
                    - StripPrefix=1

                - id: api-docs-patient-route
                  uri: http://patient-service:4000
                  predicates:
                    - Path=/api-docs/patients
                    - Path=/api-dcos/patients/swagger-ui
                  filters:
                    - RewritePath=/api-docs/patients,/v3/api-docs
                    - RewritePath=/api-docs/patients/swagger-ui,/swagger-ui.html

                - id: api-docs-auth-route
                  uri: http://auth-service:4005
                  predicates:
                    - Path=/api-docs/auth
                    - Path=/api-docs/auth/swagger-ui
                  filters:
                    - RewritePath=/api-docs/auth,/v3/api-docs
                    - RewritePath=/api-docs/auth/swagger-ui,/swagger-ui.html

                - id: api-docs-scheduling-route
                  uri: http://scheduling-service:4006
                  predicates:
                    - Path=/api-docs/scheduling
                    - Path=/api-docs/scheduling/swagger-ui
                  filters:
                    - RewritePath=/api-docs/scheduling,/v3/api-docs
                    - RewritePath=/api-docs/scheduling/swagger-ui,/swagger-ui.html
