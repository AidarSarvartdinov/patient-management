services:

  auth-service:
    build: ./auth-service
    container_name: auth-service-container
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${AUTH_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${AUTH_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_SQL_INIT_MODE=always
      
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_SHOW_SQL=true
    networks:
      - microservicesNetwork
    depends_on:
      auth-db:
        condition: service_healthy
        restart: true

  auth-db:
    image: postgres:17
    container_name: auth-db-container
    environment:
      - POSTGRES_USER=${AUTH_DB_USER}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD}
      - POSTGRES_DB=${AUTH_DB_NAME}
    volumes:
      - auth-data:/var/lib/postgresql/data
    ports:
      - "5001:5432"
    networks:
      - microservicesNetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 2s
      retries: 5

  patient-db:
    image: postgres:17
    container_name: patient-db-container
    environment:
      - POSTGRES_USER=${PATIENT_DB_USER}
      - POSTGRES_PASSWORD=${PATIENT_DB_PASSWORD}
      - POSTGRES_DB=${PATIENT_DB_NAME}
    ports: 
      - "5000:5432"
    volumes:
      - patient-data:/var/lib/postgresql/data
    networks:
      - microservicesNetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 2s
      retries: 5

  patient-service:
    build: ./patient-service/patient-service
    container_name: patient-service-container
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://patient-db:5432/${PATIENT_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${PATIENT_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PATIENT_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - BILLING_SERVICE_ADDRESS=billing-service
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - microservicesNetwork
    depends_on:
      - patient-db
      - billing-service
      - kafka

  
  billing-service:
    build: ./billing-service
    container_name: billing-service-container
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://billing-db:5432/${BILLING_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${BILLING_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${BILLING_DB_PASSWORD}
      - SPRING_SQL_INIT_MODE=always
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_API_PUBLIC_KEY=${STRIPE_API_PUBLIC_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      billing-db:
        condition: service_healthy
        restart: true
    networks:
      - microservicesNetwork

  billing-db:
    image: postgres:17
    container_name: billing-db-container
    environment:
      - POSTGRES_USER=${BILLING_DB_USER}
      - POSTGRES_PASSWORD=${BILLING_DB_PASSWORD}
      - POSTGRES_DB=${BILLING_DB_NAME}
    volumes:
      - billing-data:/var/lib/postgresql/data
    networks:
      - microservicesNetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 2s
      retries: 5
    ports:
      - "5002:5432"

  scheduling-service:
    build: ./scheduling-service
    container_name: scheduling-service-container
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://scheduling-db:5432/${SCHEDULING_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${SCHEDULING_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${SCHEDULING_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - BILLING_SERVICE_URL=http://billing-service:4001
    depends_on:
      scheduling-db:
        condition: service_healthy
        restart: true
    networks:
      - microservicesNetwork
    ports:
      - "4006:4006"

  scheduling-db:
    image: postgres:17
    container_name: scheduling-db-container
    environment:
      - POSTGRES_USER=${SCHEDULING_DB_USER}
      - POSTGRES_PASSWORD=${SCHEDULING_DB_PASSWORD}
      - POSTGRES_DB=${SCHEDULING_DB_NAME}
    volumes:
      - scheduling-data:/var/lib/postgresql/data
    networks:
      - microservicesNetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 2s
      retries: 5
    ports:
      - "5004:5432"

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service-container
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - microservicesNetwork
    depends_on:
      - kafka

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway-container
    ports:
      - "4004:4004"
    networks:
      - microservicesNetwork
    depends_on:
      - patient-service
      - auth-service
      - scheduling-service
      - billing-service

  kafka:
    image: bitnamilegacy/kafka:latest
    container_name: kafka-container
    ports:
      - "9094:9094"
    environment:
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

      # Bitnami
      - KAFKA_KRAFT_CLUSTER_ID=fosfjeoifj39fj9ew33f
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      - microservicesNetwork


networks:
  microservicesNetwork:

volumes:
  patient-data:
  auth-data:
  billing-data:
  scheduling-data:
